name: Content CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [development]
permissions:
  contents: read
concurrency:
  group: content-ci-${{ github.event_name == 'pull_request' && github.ref || 'default-branch' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Test content validation helpers
        run: python -m unittest discover -s .github/maintenance -p 'test_*.py'
      - name: Validate repository content and supported project
        run: |
          set -euo pipefail
          python .github/maintenance/content.py validate 2>&1 | tee "$RUNNER_TEMP/content-validation.log"
      - name: Report exact validation result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/content-validation.log" ]; then
            cat "$RUNNER_TEMP/content-validation.log" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Repository validation did not run; see the failed setup or guard-test step.' >> "$GITHUB_STEP_SUMMARY"
          fi
