name: AI software factory
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional issue naming README.md for a documentation-only draft'
        required: false
        type: string
  issues:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: ai-factory-${{ github.event.issue.number || github.event.inputs.issue_number || 'daily' }}
  cancel-in-progress: false
jobs:
  daily-triage:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.issue_number == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Identify failing PRs without billing calls or automatic merges
        shell: bash
        run: |
          set -euo pipefail
          echo '## Daily pull request triage' >> "$GITHUB_STEP_SUMMARY"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,title,url,statusCheckRollup --limit 100 > "$RUNNER_TEMP/prs.json"
          jq -c '.[] | select(any(.statusCheckRollup[]?; .conclusion == "FAILURE" or .conclusion == "TIMED_OUT" or .state == "FAILURE" or .state == "ERROR"))' "$RUNNER_TEMP/prs.json" > "$RUNNER_TEMP/failing-prs.jsonl"
          echo "Found $(wc -l < "$RUNNER_TEMP/failing-prs.jsonl") PRs with failed checks (up to 100 open PRs inspected)." >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r pr; do
            number=$(jq -r '.number' <<< "$pr")
            title=$(jq -r '.title' <<< "$pr")
            url=$(jq -r '.url' <<< "$pr")
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "AI repair PR #$number in:title" --json title --jq "[.[] | select(.title == \"AI repair PR #$number\")] | length")
            if [ "$existing" -eq 0 ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "AI repair PR #$number" --body "PR #$number ($title) has failing checks: $url. Maintainer investigation is required. Automatic source/dependency repair is unsupported for this content/demo repository; documentation drafts are restricted to README.md. Human review is required before merging."
            fi
            echo "- Failed checks: $url" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/failing-prs.jsonl"
          echo 'No automated source repair or merging was attempted.' >> "$GITHUB_STEP_SUMMARY"
  documentation:
    if: github.ref_name == github.event.repository.default_branch && ((github.event_name == 'issues' && github.event.label.name == 'ai:implement') || (github.event_name == 'workflow_dispatch' && inputs.issue_number != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare trusted helpers
        run: |
          python -m pip install 'PyYAML==6.0.3'
          export MAINTENANCE_HELPER="$RUNNER_TEMP/content-helper"
          echo "MAINTENANCE_HELPER=$MAINTENANCE_HELPER" >> "$GITHUB_ENV"
          mkdir -p "$MAINTENANCE_HELPER"
          cp .github/maintenance/* "$MAINTENANCE_HELPER/"
      - name: Check supported documentation scope
        id: plan
        run: bash "$MAINTENANCE_HELPER/content.sh" plan
      - name: Validate before using model credits
        if: steps.plan.outputs.supported == 'true'
        run: env -u GH_TOKEN -u GITHUB_TOKEN python "$MAINTENANCE_HELPER/content.py" validate
      - name: Install AI agent for documentation only
        if: steps.plan.outputs.supported == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          [ -n "$OPENAI_API_KEY" ] || { echo '::error::AI documentation proposal unavailable: OPENAI_API_KEY is not configured'; exit 1; }
          env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY python -m pip install 'aider-chat==0.86.1'
      - name: Propose guarded documentation for the issue
        if: steps.plan.outputs.supported == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash "$MAINTENANCE_HELPER/content.sh" propose
