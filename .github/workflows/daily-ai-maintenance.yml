name: Daily AI maintenance
on:
  schedule:
    - cron: '11 10 * * *'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: daily-content-${{ github.event_name == 'pull_request' && github.ref || 'default-branch' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Test maintenance guards
        run: python -m unittest discover -s .github/maintenance -p 'test_*.py'
      - run: bash -n .github/maintenance/content.sh
      - name: Validate repository content and supported project
        run: |
          set -euo pipefail
          python .github/maintenance/content.py validate 2>&1 | tee "$RUNNER_TEMP/content-validation.log"
      - name: Report exact validation result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/content-validation.log" ]; then
            cat "$RUNNER_TEMP/content-validation.log" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Repository validation did not run; see the failed setup or guard-test step.' >> "$GITHUB_STEP_SUMMARY"
          fi
  documentation:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare trusted helpers
        run: |
          python -m pip install 'PyYAML==6.0.3'
          export MAINTENANCE_HELPER="$RUNNER_TEMP/content-helper"
          echo "MAINTENANCE_HELPER=$MAINTENANCE_HELPER" >> "$GITHUB_ENV"
          mkdir -p "$MAINTENANCE_HELPER"
          cp .github/maintenance/* "$MAINTENANCE_HELPER/"
      - name: Check whether a documentation draft is useful
        id: plan
        run: bash "$MAINTENANCE_HELPER/content.sh" plan
      - name: Install AI agent for documentation only
        if: steps.plan.outputs.supported == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          [ -n "$OPENAI_API_KEY" ] || { echo '::error::AI documentation proposal unavailable: OPENAI_API_KEY is not configured'; exit 1; }
          env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY python -m pip install 'aider-chat==0.86.1'
      - name: Propose a guarded documentation draft
        if: steps.plan.outputs.supported == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash "$MAINTENANCE_HELPER/content.sh" propose
